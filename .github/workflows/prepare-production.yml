# Promote develop → master using the shared Code Soup production deploy action.
# https://github.com/code-soup/wp-plugin-production-deploy
name: Prepare Production Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    prepare-production:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout develop branch
              uses: actions/checkout@v5
              with:
                  ref: develop
                  fetch-depth: 0

            - name: WordPress Plugin Production Deploy
              uses: code-soup/wp-plugin-production-deploy@v1.0.0
              with:
                  php-version: "8.1"
                  node-version: "22"
                  build-command: "npm run build:prod"
                  composer-install: "true"
                  target-branch: master
                  use-deployignore: "true"
                  production-files: >-
                      includes languages assets
                      index.php run.php uninstall.php
                      composer.json
                      LICENSE.txt README.md CHANGELOG.md readme.txt
